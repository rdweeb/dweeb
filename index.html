<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="loading-screen">
        <video id="intro-video" playsinline preload="auto">
            <source src="dweeb.mp4" type="video/mp4">
        </video>
        <img id="loading-image" src="" alt="">
        <div id="loading-text"></div>
    </main>
    <section id="message-screen">
        <h1>
            THE SITE IS STILL BEING WORKED ON,<br>
            CHECK BACK LATER.
        </h1>
    </section>
    <button id="audio-toggle" aria-label="Toggle audio">
        <img id="audio-icon" src="audio.png" alt="Audio">
    </button>
    <script src="script.js"></script>
</body>
</html>
